[package]
name = "cartacolibri"
version = "0.2.0-alpha.1"
edition = "2024"
description = "CartaColibri: a 100% local AI library — RAG-fetch (incremental full-text index) + RAG-CARTA (summarize / extract / synthesize with citations) over the Colibrì gateway"
license = "MIT"
authors = ["Alexandru-Ionuț Chiuță <alexio@trom.tf>"]
repository = "https://github.com/chiuta/CartaColibri"
readme = "README.md"
rust-version = "1.90"

[workspace]
members = [".", "browser"]
resolver = "3"

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
regex = "1"
sha1 = "0.10"
hex = "0.4"
glob = "0.3"
encoding_rs = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }
pdf-extract = "0.9"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
