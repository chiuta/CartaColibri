name: CI

on:
  push:
    branches: [main, rust]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]   # ubuntu-latest (the ubuntu-26.04 label never got a runner); move back to 26.04 once GitHub offers it
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'rustfmt, clippy' }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  frontend-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }   # never older than 24
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: UI syntax + 8-language completeness
        run: node scripts/check_carta_ui.js
      - name: Generated READMEs and site are up to date
        run: |
          python scripts/gen_carta_docs.py
          git diff --exit-code -- README.md docs/cartacolibri/README.*.md site-carta/index.html

  e2e:
    name: end-to-end web UI (real server + Chrome, 8 languages)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: cargo build --release -p cartacolibri
      - run: pip install playwright
      - name: Chrome for playwright (the runner's Google Chrome, else the bundled Chromium)
        run: |
          if ! command -v google-chrome >/dev/null; then python -m playwright install --with-deps chromium; fi
      - name: Run the browser tests
        run: python tests/e2e/run_e2e.py --shots "$RUNNER_TEMP/e2e-shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: '${{ runner.temp }}/e2e-shots', if-no-files-found: ignore }

  browser:
    name: web-grab browser (Linux self-test under Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev xvfb xauth
      - run: cargo clippy -p cartacolibri-browser -- -D warnings
      - name: Self-tests (page -> library, ask, and a question across two tabs, offline backend)
        run: |
          mkdir site && printf '<html><head><meta charset="utf-8"><title>Test</title></head><body><p>Colibrii sunt păsări mici care zboară înapoi și bat din aripi.</p></body></html>' > site/p.html
          (cd site && python3 -m http.server 8899 >/dev/null 2>&1 &)
          sleep 1
          cargo build -p cartacolibri-browser -p cartacolibri
          xvfb-run -a target/debug/cartacolibri-browser http://127.0.0.1:8899/p.html --selftest-save --home "$RUNNER_TEMP/h"
          xvfb-run -a target/debug/cartacolibri-browser http://127.0.0.1:8899/p.html --selftest-ask --mock --home "$RUNNER_TEMP/h"
          printf '<html><head><meta charset="utf-8"><title>Zbor</title></head><body><p>Păsările mici precum colibri își bat aripile foarte rapid.</p></body></html>' > site/q.html
          xvfb-run -a target/debug/cartacolibri-browser http://127.0.0.1:8899/p.html http://127.0.0.1:8899/q.html --selftest-tabs --mock --home "$RUNNER_TEMP/h2"
          xvfb-run -a target/debug/cartacolibri-browser http://127.0.0.1:8899/p.html --selftest-forge --home "$RUNNER_TEMP/h3"
          target/debug/cartacolibri --home "$RUNNER_TEMP/h" search aripi | grep -q aripi

  browser-compile:
    name: web-grab browser compiles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true   # not yet run by hand on these systems
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p cartacolibri-browser
