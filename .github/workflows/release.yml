name: Tag a release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v (e.g. 0.2.0-alpha.5) - must match Cargo.toml'
        required: true
        default: '0.2.0-alpha.5'

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}   # always used through the environment, never spliced into a script

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-x86_64,   bin: cartacolibri }
          - { os: windows-latest, target: windows-x86_64, bin: cartacolibri.exe }
          - { os: macos-latest,   target: macos-arm64,    bin: cartacolibri }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Version looks like a version
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version: $VERSION"; exit 1; }
          grep -q "^version = \"$VERSION\"" Cargo.toml || { echo "Cargo.toml version differs"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      # no rust-cache here: a release is built from scratch so a poisoned cache cannot reach the artifacts
      - run: cargo test --release
      - run: cargo build --release
      - name: System libraries for the browser (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Build the web-grab browser (best effort off Linux)
        continue-on-error: true
        run: cargo build --release -p cartacolibri-browser
      - name: Check the launchers (Linux)
        if: runner.os == 'Linux'
        run: |
          for f in packaging/cartacolibri.sh packaging/install.sh packaging/CartaColibri.command; do bash -n "$f"; done
          shellcheck -S warning packaging/cartacolibri.sh packaging/install.sh packaging/CartaColibri.command
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Make the portable zip
        shell: bash
        run: |
          B=""; for f in target/release/cartacolibri-browser target/release/cartacolibri-browser.exe; do [ -f "$f" ] && B="--browser $f"; done
          python scripts/make_portable.py --version "$VERSION" --binary target/release/${{ matrix.bin }} --target ${{ matrix.target }} $B
      - name: Smoke test the Linux package (launcher + local server)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          T="$(mktemp -d)"; unzip -q dist/CartaColibriPortable-*-linux-x86_64.zip -d "$T"
          CARTACOLIBRI_PORT=18765 PATH="$T:$PATH" "$T/CartaColibriPortable/cartacolibri.sh"
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/)"; echo "HTTP $code"; test "$code" = 200
          test -d "$T/CartaColibriPortable/Data/cartacolibri"
          CARTACOLIBRI_PORT=18765 "$T/CartaColibriPortable/cartacolibri.sh" stop
      - uses: actions/upload-artifact@v4
        with: { name: 'portable-${{ matrix.target }}', path: dist/*.zip }

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { pattern: 'portable-*', path: dist, merge-multiple: true }
      - name: Checksums
        run: |
          python3 scripts/make_portable.py --sums
          cat dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Release notes (8 languages)
        run: sed "s/{version}/$VERSION/g" packaging/release-notes.md | grep -v '^<!--' > dist/NOTES.md
      - name: Draft pre-release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          grep -q "^version = \"$VERSION\"" Cargo.toml || { echo "Cargo.toml version differs"; exit 1; }
          gh release create "v$VERSION" --target "$GITHUB_SHA" dist/*.zip dist/SHA256SUMS --draft --prerelease \
            --title "CartaColibri $VERSION" --notes-file dist/NOTES.md
