name: Tag a release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v (e.g. 0.2.0-alpha.1) - must match Cargo.toml'
        required: true
        default: '0.2.0-alpha.1'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-x86_64,   bin: cartacolibri }
          - { os: windows-latest, target: windows-x86_64, bin: cartacolibri.exe }
          - { os: macos-latest,   target: macos-arm64,    bin: cartacolibri }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: System libraries for the browser (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Build the web-grab browser (best effort off Linux)
        continue-on-error: true
        run: cargo build --release -p cartacolibri-browser
      - name: Check the launchers (Linux)
        if: runner.os == 'Linux'
        run: |
          bash -n packaging/cartacolibri.sh packaging/install.sh packaging/CartaColibri.command
          shellcheck -S warning packaging/cartacolibri.sh packaging/install.sh packaging/CartaColibri.command
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Make the portable zip
        shell: bash
        run: |
          B=""; for f in target/release/cartacolibri-browser target/release/cartacolibri-browser.exe; do [ -f "$f" ] && B="--browser $f"; done
          python scripts/make_portable.py --version ${{ inputs.version }} --binary target/release/${{ matrix.bin }} --target ${{ matrix.target }} $B
      - name: Smoke test the Linux package (launcher + local server)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          T="$(mktemp -d)"; unzip -q dist/CartaColibriPortable-*-linux-x86_64.zip -d "$T"
          CARTACOLIBRI_PORT=18765 PATH="$T:$PATH" "$T/CartaColibriPortable/cartacolibri.sh"
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/)"; echo "HTTP $code"; test "$code" = 200
          test -d "$T/CartaColibriPortable/Data/cartacolibri"
          CARTACOLIBRI_PORT=18765 "$T/CartaColibriPortable/cartacolibri.sh" stop
      - uses: actions/upload-artifact@v4
        with: { name: 'portable-${{ matrix.target }}', path: dist/*.zip }

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'portable-*', path: dist, merge-multiple: true }
      - name: Checksums
        run: |
          python3 scripts/make_portable.py --sums
          cat dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Release notes (8 languages)
        run: sed 's/{version}/${{ inputs.version }}/g' packaging/release-notes.md | grep -v '^<!--' > dist/NOTES.md
      - name: Draft pre-release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          grep -q "^version = \"${{ inputs.version }}\"" Cargo.toml || { echo "Cargo.toml version differs"; exit 1; }
          gh release create "v${{ inputs.version }}" dist/*.zip dist/SHA256SUMS --draft --prerelease \
            --title "CartaColibri ${{ inputs.version }}" --notes-file dist/NOTES.md
