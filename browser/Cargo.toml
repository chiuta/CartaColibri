[package]
name = "cartacolibri-browser"
version = "0.2.0-alpha.10"
edition = "2024"
description = "web-grab browser: a small Rust browser shell (system webview) that saves pages into your CartaColibri library and asks your local Colibrì about them"
license = "MIT"
authors = ["Alexandru-Ionuț Chiuță <alexio@trom.tf>", "Alexandru Dumbrava"]
repository = "https://github.com/chiuta/CartaColibri"
rust-version = "1.90"

[dependencies]
cartacolibri = { path = ".." }
wry = "0.57"
tao = "0.37"
serde_json = "1"
hex = "0.4"
ureq = "3"
getrandom = "0.3"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"
